name: WorkFlowAI Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Add toolchain setup here if needed (setup-node / setup-python / setup-dotnet / etc.)

      - name: Run quality gates
        shell: pwsh
        run: ./scripts/workflowai-quality-gates.ps1 -ProjectPath .

