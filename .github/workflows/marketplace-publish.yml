name: Publish Extension
on:
    pull_request:
        types: [closed]
    workflow_dispatch:

env:
    GIT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || 'main' }}
    NODE_VERSION: 20.20.0
    PNPM_VERSION: 10.8.1
    TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
    verify-release:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        if: >
            ( github.event_name == 'pull_request' &&
            github.event.pull_request.merged == true &&
            github.event.pull_request.base.ref == 'main' &&
            contains(github.event.pull_request.title, 'Changeset version bump') ) ||
            github.event_name == 'workflow_dispatch'
        outputs:
            version: ${{ steps.get-version.outputs.version }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  ref: ${{ env.GIT_REF }}
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"
            - name: Turbo cache setup
              uses: actions/cache@v5
              with:
                  path: .turbo
                  key: ${{ runner.os }}-turbo-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Get version
              id: get-version
              run: |
                  current_package_version=$(node -p "require('./src/package.json').version")
                  echo "version=${current_package_version}" >> $GITHUB_OUTPUT
                  echo "Version: ${current_package_version}"
            - name: Lint
              run: pnpm lint
            - name: Check types
              run: pnpm check-types
            - name: Run packages/types tests
              working-directory: packages/types
              run: pnpm test
            - name: Run packages/cloud tests
              working-directory: packages/cloud
              run: pnpm test
            - name: Run packages/telemetry tests
              working-directory: packages/telemetry
              run: pnpm test
            - name: Run extension coverage
              working-directory: src
              run: pnpm test:coverage
            - name: Run webview coverage
              working-directory: webview-ui
              run: pnpm test:coverage

    package-vsix:
        needs: verify-release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  ref: ${{ env.GIT_REF }}
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Package Extension
              run: |
                  current_package_version="${{ needs.verify-release.outputs.version }}"
                  pnpm vsix:production

                  unzip -l bin/kilo-code-${current_package_version}.vsix > /tmp/kilo-code-vsix-contents.txt

                  grep -q "extension/package.json" /tmp/kilo-code-vsix-contents.txt || exit 1
                  grep -q "extension/package.nls.json" /tmp/kilo-code-vsix-contents.txt || exit 1
                  grep -q "extension/dist/extension.js" /tmp/kilo-code-vsix-contents.txt || exit 1
                  grep -q "extension/webview-ui/audio/celebration.wav" /tmp/kilo-code-vsix-contents.txt || exit 1
                  grep -q "extension/webview-ui/build/assets/index.js" /tmp/kilo-code-vsix-contents.txt || exit 1
                  grep -q "extension/assets/codicons/codicon.ttf" /tmp/kilo-code-vsix-contents.txt || exit 1
                  grep -q "extension/assets/vscode-material-icons/icons/3d.svg" /tmp/kilo-code-vsix-contents.txt || exit 1
                  if grep -q "extension/.env" /tmp/kilo-code-vsix-contents.txt; then
                    echo "Unexpected .env found inside VSIX"
                    exit 1
                  fi

                  rm /tmp/kilo-code-vsix-contents.txt
            - name: Upload VSIX artifact
              uses: actions/upload-artifact@v6
              with:
                  name: kilo-code-vsix
                  path: bin/kilo-code-${{ needs.verify-release.outputs.version }}.vsix

    publish-vscode:
        needs: [verify-release, package-vsix]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  ref: ${{ env.GIT_REF }}
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Download VSIX artifact
              uses: actions/download-artifact@v7
              with:
                  name: kilo-code-vsix
                  path: bin/
            - name: Publish to VS Code Marketplace
              env:
                  VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
                  OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
              run: |
                  set -euo pipefail
                  current_package_version="${{ needs.verify-release.outputs.version }}"
                  cd src
                  npx vsce publish --packagePath ../bin/kilo-code-${current_package_version}.vsix
                  npx ovsx publish ../bin/kilo-code-${current_package_version}.vsix
                  echo "Successfully published version $current_package_version to VS Code Marketplace"

    package-jetbrains:
        needs: verify-release
        runs-on: ubuntu-latest
        outputs:
            bundle_name: ${{ steps.get_bundle_name.outputs.bundle_name }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  ref: ${{ env.GIT_REF }}
                  submodules: recursive
                  lfs: true
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"
            - uses: actions/setup-java@v5
              with:
                  distribution: "jetbrains"
                  java-version: "21"
                  check-latest: false
                  token: ${{ secrets.GITHUB_TOKEN }}
            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v5
              with:
                  cache-read-only: false
            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libx11-dev \
                    libxkbfile-dev \
                    pkg-config \
                    build-essential \
                    python3
            - name: Turbo cache setup
              uses: actions/cache@v5
              with:
                  path: .turbo
                  key: ${{ runner.os }}-turbo-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-turbo-
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build JetBrains Plugin
              run: pnpm run jetbrains:bundle
              shell: bash
            - name: Get bundle name
              id: get_bundle_name
              run: echo "bundle_name=$(node jetbrains/plugin/scripts/get_bundle_name.js)" >> $GITHUB_OUTPUT
            - name: Upload JetBrains artifact
              uses: actions/upload-artifact@v6
              with:
                  name: jetbrains-plugin-bundle
                  path: jetbrains/plugin/build/distributions/${{ steps.get_bundle_name.outputs.bundle_name }}

    publish-jetbrains:
        needs: [package-jetbrains]
        runs-on: ubuntu-latest
        steps:
            - name: Download JetBrains artifact
              uses: actions/download-artifact@v7
              with:
                  name: jetbrains-plugin-bundle
                  path: jetbrains/plugin/build/distributions
            - name: Publish to JetBrains Marketplace
              run: |
                  set -euo pipefail
                  curl --fail-with-body --silent --show-error \
                    -X POST \
                    -H "Authorization: Bearer ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}" \
                    -F "file=@jetbrains/plugin/build/distributions/${{ needs.package-jetbrains.outputs.bundle_name }}" \
                    -F "pluginId=28350" \
                    -F "channel=stable" \
                    -F "isHidden=false" \
                    https://plugins.jetbrains.com/plugin/uploadPlugin
                  echo "Successfully published to JetBrains Marketplace"

    create-release:
        needs: [verify-release, package-vsix, publish-vscode, package-jetbrains, publish-jetbrains]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  ref: ${{ env.GIT_REF }}
            - name: Download VSIX artifact
              uses: actions/download-artifact@v7
              with:
                  name: kilo-code-vsix
                  path: bin
            - name: Download JetBrains artifact
              uses: actions/download-artifact@v7
              with:
                  name: jetbrains-plugin-bundle
                  path: jetbrains/plugin/build/distributions
            - name: Configure Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
            - name: Create and Push Git Tag
              run: |
                  current_package_version="${{ needs.verify-release.outputs.version }}"
                  if git ls-remote --tags origin | grep -q "refs/tags/v${current_package_version}$"; then
                    echo "Tag v${current_package_version} already exists remotely, skipping tag creation"
                  else
                    git tag -a "v${current_package_version}" -m "Release v${current_package_version}"
                    git push origin "v${current_package_version}" --no-verify
                    echo "Successfully created and pushed git tag v${current_package_version}"
                  fi
            - name: Create or Update GitHub Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  current_package_version="${{ needs.verify-release.outputs.version }}"
                  bundle_name="${{ needs.package-jetbrains.outputs.bundle_name }}"
                  changelog_content=$(sed -E -n "/^## \[?v?${current_package_version}\]?/,/^## /p" CHANGELOG.md | sed '$d')

                  if [ -z "$changelog_content" ]; then
                    echo "Error: No changelog section found for version ${current_package_version}"
                    exit 1
                  fi

                  if gh release view "v${current_package_version}" >/dev/null 2>&1; then
                    gh release upload "v${current_package_version}" \
                      "bin/kilo-code-${current_package_version}.vsix#VSIX" \
                      "jetbrains/plugin/build/distributions/${bundle_name}#JetBrains Plugin" \
                      --clobber
                  else
                    gh release create "v${current_package_version}" \
                      --title "Release v${current_package_version}" \
                      --notes "$changelog_content" \
                      --target ${{ env.GIT_REF }} \
                      "bin/kilo-code-${current_package_version}.vsix#VSIX" \
                      "jetbrains/plugin/build/distributions/${bundle_name}#JetBrains Plugin"
                  fi
                  echo "Successfully finalized GitHub Release v${current_package_version}"
